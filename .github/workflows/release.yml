name: Release Obsidian plugin

# Tag the commit with the exact version from manifest.json (e.g. `0.1.0`, no
# `v` prefix) and push the tag to trigger a release with the plugin assets.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build plugin
        working-directory: obsidian-plugin
        run: |
          npm ci
          npm run build

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp manifest.json dist/
          cp obsidian-plugin/main.js dist/
          cp obsidian-plugin/styles.css dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/manifest.json dist/main.js dist/styles.css \
            --title "$TAG" \
            --generate-notes
